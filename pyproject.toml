[project]
name = "cloudflare-warp-api-bridge"
version = "0.1.0"
description = "Route the Cloudflare WARP control API through the WARP tunnel via a local TCP bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = ["pyright==1.1.414"]

[tool.pyright]
include = ["main.py", "config.py", "services"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
