[project]
name = "motion-camera-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = ["pyright==1.1.414"]

[tool.pyright]
include = ["main.py", "config.py", "services", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
